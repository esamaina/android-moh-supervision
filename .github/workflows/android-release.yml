name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Prepare signing keystore
        env:
          SST_KEYSTORE_BASE64: ${{ secrets.SST_KEYSTORE_BASE64 }}
          SST_KEYSTORE_PASSWORD: ${{ secrets.SST_KEYSTORE_PASSWORD }}
          SST_KEY_ALIAS: ${{ secrets.SST_KEY_ALIAS }}
          SST_KEY_PASSWORD: ${{ secrets.SST_KEY_PASSWORD }}
        run: |
          if [ -n "${SST_KEYSTORE_BASE64}" ]; then
            echo "${SST_KEYSTORE_BASE64}" | base64 --decode > sst-release.jks
            echo "SST_KEYSTORE_PATH=$PWD/sst-release.jks" >> $GITHUB_ENV
            echo "SST_KEYSTORE_PASSWORD=${SST_KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "SST_KEY_ALIAS=${SST_KEY_ALIAS}" >> $GITHUB_ENV
            echo "SST_KEY_PASSWORD=${SST_KEY_PASSWORD}" >> $GITHUB_ENV
          fi

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew clean assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SST-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
